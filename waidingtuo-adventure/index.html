<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d24">
  <meta name="description" content="歪顶坨山脊横版像素动画。沿岩阶跃上山脊，环线地图同步显示顺时针进度。">
  <title>歪顶坨大冒险</title>
  <style>
:root {
  color-scheme: dark;
  font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #101d24;
  color: #fff0ce;
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 20px; }
.player { width: min(100%, 1600px, calc((100svh - 112px) * 1.777)); }
.scene { display: block; width: 100%; height: auto; aspect-ratio: 1672 / 941; background: #15506c; border: 1px solid #527077; }
.deck {
  background: #142830;
  border: 1px solid #527077;
  border-top: 0;
  display: flex;
  min-height: 65px;
  padding: 10px 16px;
  align-items: center;
  justify-content: space-between;
  gap: 12px 22px;
}
.chapter { display: grid; gap: 2px; }
.chapter strong { font-size: 16px; font-weight: 750; }
.chapter span { color: #adc6c4; font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls button, .controls a {
  align-items: center;
  background: #213a41;
  border: 1px solid #567074;
  border-radius: 3px;
  color: #fff0ce;
  cursor: pointer;
  display: inline-flex;
  font: 700 14px/1.3 system-ui, sans-serif;
  gap: 8px;
  justify-content: center;
  min-height: 44px;
  padding: 8px 12px;
  text-decoration: none;
}
.controls button:first-child { background: #edbc70; border-color: #f9d691; color: #23302a; }
.controls button:disabled { cursor: wait; opacity: .66; }
.controls button:not(:disabled):hover, .controls a:hover { filter: brightness(1.18); }
.controls button:focus-visible, .controls a:focus-visible { outline: 3px solid #8be9ef; outline-offset: 3px; }
.icon { display: inline-block; width: 14px; height: 14px; flex: none; background: currentColor; }
.pause { clip-path: polygon(15% 0,38% 0,38% 100%,15% 100%,15% 0,60% 0,84% 0,84% 100%,60% 100%,60% 0); }
.play { clip-path: polygon(20% 0,91% 50%,20% 100%); }
.replay { border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; background: transparent; position: relative; }
.replay::after { content: ""; position: absolute; right: -3px; width: 0; height: 0; border-top: 4px solid currentColor; border-left: 4px solid transparent; }
.save { clip-path: polygon(43% 0,59% 0,59% 47%,90% 47%,51% 77%,13% 47%,43% 47%,43% 0,100% 0,100% 100%,0 100%,0 84%,100% 84%,100% 0); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (max-width: 680px) and (orientation: portrait) {
  body { padding: 10px; }
  .player { width: 100%; }
  .deck { flex-wrap: wrap; padding: 12px; }
  .controls { width: 100%; }
  .controls > * { flex: 1 1 auto; }
}
@media (orientation: landscape) and (max-height: 520px) {
  body { padding: 4px; }
  .player { width: min(100%, calc((100svh - 61px) * 1.777)); }
  .deck { min-height: 50px; padding: 2px 8px; }
  .chapter span { display: none; }
}

[hidden] { display: none !important; }
.player:has(.playing) { width: min(100%, 1600px, calc((100svh - 177px) * 1.777)); }
.scene.playing:focus { outline: 0; }
.scene .game-graphic, .scene.playing .demo-graphic { display: none; }
.scene.playing .game-graphic { display: inline; }
.game-deck {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 18px;
  padding: 8px 16px;
  background: #1c343b;
  border: 1px solid #527077;
  border-top: 0;
}
.game-help { display: grid; gap: 1px; font-size: 14px; }
.game-help span { color: #c0d4cf; font-size: 13px; }
.game-controls { display: flex; gap: 8px; }
.game-controls button {
  min-height: 44px;
  min-width: 62px;
  background: #29464d;
  color: #fff0ce;
  border: 1px solid #90a8a6;
  border-radius: 3px;
  font: 750 14px system-ui, sans-serif;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.game-controls button:last-child { background: #efbc70; color: #21302c; border-color: #f8d493; }
.game-controls button:active { transform: translateY(2px); }
.game-controls button:focus-visible { outline: 3px solid #8be9ef; outline-offset: 2px; }
@media (max-width: 680px) and (orientation: portrait) {
  .player:has(.playing) { width: 100%; }
  .game-deck { flex-wrap: wrap; padding: 10px 12px; }
  .game-help span { display: none; }
  .game-controls { width: 100%; }
  .game-controls button { flex: 1; min-height: 50px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .player:has(.playing) { width: min(100%, calc((100svh - 110px) * 1.777)); }
  .game-deck { padding: 1px 8px; }
  .game-help span { display: none; }
  .game-controls button { min-height: 42px; }
}

  </style>
</head>

    <h1 class="sr-only">歪顶坨大冒险</h1>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-labelledby="title description" id="scene" class="scene" tabindex="-1">
<title id="title">歪顶坨大冒险</title>
<desc id="description">戴灰黑针织帽和墨镜、穿浅蓝冲锋衣的徒步小人在岩阶间跳跃，抵达歪顶坨山旗。右侧为杨庄水库和按 KML 绘制的 7.4 公里顺时针环线。动画展示约 3.2 公里至 4.3 公里登顶段。</desc>

<script>
class RidgeGame {
  static terrain = [
    [[62, 801], [112, 766], [174, 732], [223, 708], [275, 681], [376, 665], [438, 665]],
    [[508, 647], [559, 638], [640, 618], [704, 604], [790, 586], [843, 578],
      [871, 554], [918, 546], [948, 510], [984, 500], [1032, 484], [1160, 477]],
  ];
  static bounds = { start: 105, finish: 1025, summitKm: 4.283 };
  static controls = {
    ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
    Space: "jump", ArrowUp: "jump", KeyW: "jump",
  };

  constructor(scene) {
    this.scene = scene;
    this.panel = document.getElementById("game-deck");
    this.message = document.getElementById("game-status");
    this.runner = document.querySelector("#game-runner > g");
    this.marker = document.getElementById("game-marker");
    this.bar = document.getElementById("game-bar");
    this.trace = document.getElementById("game-trace");
    this.tally = document.getElementById("game-tally");
    this.distance = document.getElementById("game-distance");
    this.goal = document.getElementById("game-goal");
    this.hearts = [...document.querySelectorAll('use[id^="heart-"]')];
    this.coins = [[601, 553], [781, 515], [906, 459]].map(([x, y], index) => ({
      x, y, node: document.getElementById(`game-coin-${index + 1}`),
    }));

    const track = document.getElementById("demo-route-track");
    const time = track.getAttribute("keyTimes").split(";").map(Number);
    const points = track.getAttribute("values").split(";").map(value => value.split(" ").map(Number));
    this.route = points.map(([x, y], index) => ({ x, y, t: time[index] / 0.726667 }));

    this.keys = new Set();
    this.pointers = new Map();
    this.active = false;
    this.lastTime = 0;

    document.addEventListener("keydown", event => {
      if (!this.active || event.altKey || event.metaKey || event.ctrlKey) return;
      const action = RidgeGame.controls[event.code];
      if (!action || (event.code === "Space" && event.target.closest?.("button,a"))) return;
      event.preventDefault();
      this.keys.add(event.code);
      if (action === "jump" && !event.repeat) this.jump();
    });
    document.addEventListener("keyup", event => this.keys.delete(event.code));
    window.addEventListener("blur", () => this.clearInput());
    document.addEventListener("visibilitychange", () => this.clearInput());

    for (const button of this.panel.querySelectorAll("[data-move]")) {
      button.addEventListener("pointerdown", event => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        button.setPointerCapture(event.pointerId);
        this.pointers.set(event.pointerId, button.dataset.move);
        if (button.dataset.move === "jump") this.jump();
        else this.nudge(button.dataset.move === "right" ? 1 : -1);
      });
      for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
        button.addEventListener(type, event => this.pointers.delete(event.pointerId));
      }
      button.addEventListener("click", event => {
        if (event.detail !== 0) return;
        if (button.dataset.move === "jump") this.jump();
        else this.nudge(button.dataset.move === "right" ? 1 : -1);
      });
    }
  }

  platformAt(x) {
    for (const ledge of RidgeGame.terrain) {
      for (let i = 1; i < ledge.length; i += 1) {
        const [x0, y0] = ledge[i - 1];
        const [x1, y1] = ledge[i];
        if (x >= x0 && x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
      }
    }
    return null;
  }

  enter() {
    this.active = true;
    this.scene.classList.add("playing");
    this.panel.hidden = false;
    this.reset();
    this.scene.focus({ preventScroll: true });
    this.frame = requestAnimationFrame(time => this.tick(time));
  }

  exit() {
    this.active = false;
    this.clearInput();
    cancelAnimationFrame(this.frame);
    this.scene.classList.remove("playing");
    this.panel.hidden = true;
    for (const heart of this.hearts) heart.removeAttribute("fill");
  }

  clearInput() {
    this.keys.clear();
    this.pointers.clear();
  }

  reset(message = "收集足迹徽章，跳过沟谷，登上歪顶坨。") {
    this.clearInput();
    this.lives = 3;
    this.checkpoint = 358;
    this.finished = false;
    this.lastTime = 0;
    for (const coin of this.coins) coin.collected = false;
    this.spawn(RidgeGame.bounds.start);
    this.message.textContent = message;
    this.paint();
  }

  spawn(x) {
    this.x = x;
    this.y = this.platformAt(x);
    this.velocity = 0;
    this.grounded = true;
    this.direction = 1;
  }

  jump() {
    if (!this.grounded || this.finished) return;
    this.velocity = -580;
    this.grounded = false;
  }

  held(action) {
    return [...this.keys].some(code => RidgeGame.controls[code] === action)
      || [...this.pointers.values()].includes(action);
  }

  nudge(direction) {
    if (!this.finished) this.step(0.10, direction);
  }

  tick(time) {
    if (!this.active) return;
    const elapsed = this.lastTime ? Math.min((time - this.lastTime) / 1000, 0.035) : 0;
    this.lastTime = time;
    const direction = Number(this.held("right")) - Number(this.held("left"));
    if (!this.finished) this.step(elapsed, direction);
    this.frame = requestAnimationFrame(next => this.tick(next));
  }

  step(elapsed, direction) {
    if (direction) this.direction = direction;
    const oldY = this.y;
    this.x = Math.min(1125, Math.max(67, this.x + direction * 258 * elapsed));
    const ground = this.platformAt(this.x);

    if (this.grounded && ground !== null) this.y = ground;
    else {
      this.grounded = false;
      this.velocity += 1390 * elapsed;
      this.y += this.velocity * elapsed;
      if (ground !== null && this.velocity >= 0
          && this.y >= ground && oldY <= ground + 3) {
        this.y = ground;
        this.velocity = 0;
        this.grounded = true;
      }
    }

    if (this.grounded && this.x >= 508) this.checkpoint = 550;

    if (this.y > 978) {
      this.lives -= 1;
      if (this.lives === 0) {
        this.reset("体力用完，已回到起点。再试一次！");
        return;
      }
      this.spawn(this.checkpoint);
      this.message.textContent = `落入沟谷，已回到岩阶。剩余 ${this.lives} 格体力。`;
    }

    for (const coin of this.coins) {
      if (!coin.collected && Math.hypot(this.x + 24 - coin.x, this.y - 82 - coin.y) < 71) {
        coin.collected = true;
      }
    }

    if (this.x >= RidgeGame.bounds.finish && this.grounded) {
      this.finished = true;
      this.message.textContent = `已登顶歪顶坨 · 收集足迹徽章 ${this.score()} / 3`;
    }
    this.paint();
  }

  score() {
    return this.coins.filter(coin => coin.collected).length;
  }

  paint() {
    const progress = Math.max(0, Math.min(1,
      (this.x - RidgeGame.bounds.start) / (RidgeGame.bounds.finish - RidgeGame.bounds.start)));
    const next = this.route.findIndex(point => point.t >= progress);
    const to = this.route[Math.max(0, next)];
    const from = this.route[Math.max(0, next - 1)];
    const fraction = to.t === from.t ? 0 : (progress - from.t) / (to.t - from.t);
    this.marker.setAttribute("transform", `translate(${from.x + (to.x - from.x) * fraction} ${from.y + (to.y - from.y) * fraction})`);
    this.trace.setAttribute("stroke-dashoffset", String(1 - progress));
    this.bar.setAttribute("stroke-dasharray", `${(3.2 + (RidgeGame.bounds.summitKm - 3.2) * progress) / 7.426} 1`);
    this.distance.textContent = `${(3.2 + (RidgeGame.bounds.summitKm - 3.2) * progress).toFixed(1)} / 7.4 km`;
    this.runner.setAttribute("transform", `translate(${this.x + 44 * this.direction} ${this.y + 1}) scale(${this.direction} 1)`);
    this.tally.textContent = `${this.score()}/3`;
    this.goal.setAttribute("opacity", this.finished ? "1" : "0");
    for (const coin of this.coins) coin.node.style.visibility = coin.collected ? "hidden" : "visible";
    for (const [index, heart] of this.hearts.entries()) {
      heart.setAttribute("fill", index < this.lives ? "#ef8965" : "#576f73");
    }
  }
}

</script>
<script>
const animation = document.getElementById("scene");
const mode = document.getElementById("mode");
const toggle = document.getElementById("toggle");
const replay = document.getElementById("replay");
const replayLabel = document.getElementById("replay-label");
const label = document.getElementById("toggle-label");
const icon = document.getElementById("play-icon");
const status = document.getElementById("status");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
const game = new RidgeGame(animation);

function showState(announce = false) {
  const paused = animation.animationsPaused();
  label.textContent = paused ? "播放" : "暂停";
  icon.className = paused ? "icon play" : "icon pause";
  if (announce) status.textContent = paused ? "动画已暂停" : "动画正在播放";
}

if (reduceMotion.matches) {
  animation.setCurrentTime(0);
  animation.pauseAnimations();
}
toggle.disabled = false;
replay.disabled = false;
showState();

mode.addEventListener("click", () => {
  if (game.active) {
    game.exit();
    animation.setCurrentTime(0);
    if (!reduceMotion.matches) animation.unpauseAnimations();
    toggle.hidden = false;
    mode.textContent = "开始闯关";
    replayLabel.textContent = "重播";
    status.textContent = "已返回动画演示";
    showState();
    return;
  }
  animation.pauseAnimations();
  animation.setCurrentTime(0);
  toggle.hidden = true;
  mode.textContent = "返回演示";
  replayLabel.textContent = "重新闯关";
  status.textContent = "闯关模式已开启";
  game.enter();
});

toggle.addEventListener("click", () => {
  if (animation.animationsPaused()) animation.unpauseAnimations();
  else animation.pauseAnimations();
  showState(true);
});

replay.addEventListener("click", () => {
  if (game.active) {
    game.reset();
    animation.focus({ preventScroll: true });
    return;
  }
  animation.setCurrentTime(0);
  animation.unpauseAnimations();
  showState();
  status.textContent = "动画已从头播放";
});

reduceMotion.addEventListener("change", ({ matches }) => {
  if (game.active) return;
  if (matches) animation.pauseAnimations();
  else animation.unpauseAnimations();
  showState();
});

</script>
